<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- <p id="star"></p> -->
     <h1 id="star"></h1>

    <script>
        let i = 1;
        let m = 5;




        while (i <= m) {
            // console.log(i );
            let row = "* "
            // document.getElementById("star").innerHTML += "*";
            let j = 1
            while (j <= i) {
                // console.log(j + "*");
                row += j + " "
                
                j++
            }

            console.log(row);
            document.getElementById("star").innerHTML += row + "<br/>"

            
            i++

        }

    </script>
</body>

</html>

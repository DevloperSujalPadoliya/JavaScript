<body>
    <script>
        
        let n = 60;
        let j = 1;
        let m = 60;

        let count = 0;
        
        let a = 1;

            console.log(a + " hourfsgfrgsghh");

                console.log(i + "min");

                    console.log(j + "sec");
                    j++
                    count++
                }
                i++

            }
            count
            a++
        }
        alert(count)

    </script>

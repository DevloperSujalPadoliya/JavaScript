<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function add(a, b) {
            return a + b
        }
        function sub(a, b) {
            return a - b
        }
        function mul(a, b) {
            return a * b
        }
         function div(a, b) {
            return a / b
        }
        function addednum(){
            let n1 = Number(prompt())
            let n2 = Number(prompt())
            // return 
            let added = add(n1 , n2)
            let subtract = sub(n1 , n2)
            let multi = mul(n1 , n2)
            let divide = div(n1 , n2)

            console.log(added + "+" + subtract + "+" + multi + "+" + divide);
            
        }

        addednum()
    </script>
</body>
</html>

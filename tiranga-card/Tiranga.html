<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiranga Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        body {
            padding: 0px;
            margin: 0px;
            font-family: Roboto;
        }

        .main {
            width: 100vw;
            height: 100vh;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 50%;
            height: 60%;
            background-color: orange;
            background-image: linear-gradient(to bottom right, orange, white, green);

        }

        .image {
            width: 100%;
            height: 20%;
            background-color: rgba(255, 255, 255, 0);
            display: flex;



        }

        .box1 {
            width: 15%;
            height: 100%;
            background-color: rgba(255, 0, 0, 0);
            /* gap: 50px; */
        }

        .box2 {
            width: 70%;
            height: 100%;
            background-color: rgba(11, 212, 11, 0);
            text-align: center;
            align-content: center;
            font-size: 30px;

        }

        .info {
            width: 100%;
            height: 70%;
            background-color: rgba(255, 0, 0, 0);
            display: flex;
        }

        .name {
            width: 60%;
            height: 100%;
            background-color: rgba(0, 128, 0, 0);
            /* text-align: center; */

            align-content: center;
            font-size: 20px;
        }

        .img {
            width: 41%;
            height: 100%;
            background-color: rgba(240, 128, 128, 0);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        label {
            margin-left: 20px;
        }

        .final-img {
            width: 50%;
            height: 50%;
            background-color: rgba(255, 255, 255, 0);
        }

        .line {
            width: 100%;
            height: 10%;
            background-color: rgba(255, 255, 255, 0);
            text-align: center;
            align-content: center;
            font-size: 20px;
        }
        img{
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box">
            <div class="image">
                <div class="box1"><img
                        src="https://cdn.pngedits.com/uploads/preview/indian-flag-vector-clip-art-png-fouj-image-download-transparent-background-ohilpoe.webp"
                        alt="" width="100%" height="100%"></div>
                <div class="box2"><b>मेरा भारत - मेरी पहचान</b></div>
                <div class="box1"><img
                        src="https://cdn.pngedits.com/uploads/preview/indian-flag-vector-clip-art-png-fouj-image-download-transparent-background-ohilpoe.webp"
                        alt="" width="100%" height="100%"></div>

            </div>
            <div class="info">
                <div class="name">
                    <label>Name : </label><span id="input1">sujal</span><br><br>
                    <label>Mobile No : </label><span id="input2">57481</span><br><br>
                    <label>Address : </label><span id="input3">dfsd</span>
                </div>
                <div class="img">
                    <div class="final-img"><img id="image1" alt="" width="100%" height="100%"></div>
                    <button onclick="imggenrate()">click</button>
                </div>
            </div>
            <div class="line"><b>जहां तिरंगा, वहीं मेरा अभिमान ।</b></div>
        </div>
    </div>

    <script>
        let name = prompt("Enter Your Name :");
        let Mobile = prompt("Enter Your Mobile no :");
        let address = prompt("Enter Your Address :");
      



        document.getElementById("input1").innerHTML = name;
        document.getElementById("input2").innerHTML = Mobile;
        document.getElementById("input3").innerHTML = address;
      
function imggenrate(){
    document.getElementById("image1").src = "https://img.freepik.com/free-photo/young-handsome-man-wearing-casual-tshirt-blue-background-happy-face-smiling-with-crossed-arms-looking-camera-positive-person_839833-12963.jpg?semt=ais_hybrid&w=740&q=80"
}
      


    </script>
</body>

</html>

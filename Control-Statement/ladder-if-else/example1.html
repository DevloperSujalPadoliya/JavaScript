<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student marks</title>
</head>
<body>
    <script>
        let marks = prompt("Enter Your Marks : ");

        if(marks >= 90){
            alert("A Grade")
        }
       else if ( marks >=75){
        alert("B Grade")
       }

       else if(marks >= 50){
        alert("C Garde")
       }

       else if(marks >= 35){
        alert("D Grade")
       }

       else {
        alert("fail")
       }

       location.reload();
    </script>
</body>
</html>

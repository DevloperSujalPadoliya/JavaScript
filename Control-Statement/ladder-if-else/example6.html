<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<style>

    body{
        display: flex;
        justify-content: center;
        align-content: center;
    }
    .main{
        width: 100vw;
        height: 100vh;
        background-color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

    }

    .display{
        width: 20%;
        height: 20%;
        background-color: black;
       text-align: center;
       align-content: center;
        font-size: 30px;
        color: white;
        
        
    }

    p{
        font-size: 30px;
        /* margin-left: 30px; */
    }

    .buttons{
        width: 20%;
        height: 60%;
        background-color: black;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        flex-direction: row;
       justify-items: center;
        align-items: center;
    
    }

    button{
        width: 65px;
        height: 65px;
        border: none;
        background-color: gray;
        border-radius: 100px;
        font-size: 20px;
        color: white;
    }

    input{
        width: 100%;
        height: 100%;
        background-color: black;
        color: white;
        text-align: center;
        align-content: center;
        font-size: 200%;
        border: none;
        display: none;
    }

    .call{
       background-color: black; 
       color: black;

    }
</style>
<body>
    <div class="main">
        <div  class="display" id="display">
            <input type="text" name="" id="input" onclick="display()">
            
            <p id="display"></p>
        </div>
        <div class="buttons">
            <button id="one" onclick="clickone()">1</button>
            <button id="two" onclick="clicktwo()">2</br>abc</button>
            <button id="three" onclick="clickthree()">3</br>def</button>

            <button id="eight" onclick="clickeight()">8</br>tuv</button>
            <button id="nine" onclick="clicknine()">9</br>wxyz</button>
            <button id="zero" onclick="clickzero()">0</br>+</button>
            <button id="star" onclick="clickstar()">*</button>
            <button id="#h" onclick="clickhaj()">#</button>
            <button class="call" id="#h" onclick="clickhaj()">#</button>

            <button  onclick="cheackedcallmessage()">click</button>
            
        </div>

    </div>
</body>

            alert("This over customer number : 1-8100-3825")

            alert("wrong button click")

        if(2 == 0 ){

        else(
            alert("Exit over Call")

</html>

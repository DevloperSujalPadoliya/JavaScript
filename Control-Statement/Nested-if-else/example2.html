<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page using nested</title>
</head>
<body>
    <script>
        let user1 = prompt("enter the username and email")
         


        
        const email = "sujal";
        const pass = "123";

        if(user1 == email){
            let user2 = prompt("enter the pass")
            if(user2 == pass){
                alert("login succesful")
            }
            else{
                alert("pass is not correct")
            }
        }
        else{
            alert("Email is not correct")
        }
       

    </script>
</body>
</html>

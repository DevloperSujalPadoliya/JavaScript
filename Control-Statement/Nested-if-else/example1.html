<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>positive and negative  number check in nested </title>
</head>
<body>
    <script>
        let num = prompt("Enter the number :");

        if(num >= 0){
            if(num == 0){
               alert("zero")
            }
            else{
                alert("positive")
            }
          
        }
          else{
                alert("negative")
            }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let vowel = prompt("Enter a letter : ");

        if(vowel == 'e' || vowel == 'a' || vowel== 'i' || vowel == 'o' || vowel == 'u'){
            alert(vowel + " Is a vowel ")
        }
        else{
            alert(vowel + " Not vowel")
        }
    </script>
</body>
</html>

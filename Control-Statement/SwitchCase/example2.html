    <script>
    let pizzaprice = 0;

    function getpizza() {
        switch (pizzaprice) {
            case 150:
                alert("Small Pizza Price: " + pizzaprice);
                break;

            case 250:
                alert("Medium Pizza Price: " + pizzaprice);
                break;

            case 350:
                alert("Large Pizza Price: " + pizzaprice);
                break;

            default:
                alert("Please select a valid pizza");
        }
    }

    function smallpizza() {
        pizzaprice = 150;
        getpizza();
    }

    function mediumpizza() {
        pizzaprice = 250;
        getpizza();
    }

    function largepizza() {
        pizzaprice = 350;
        getpizza();
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example3</title>
</head>
<body>
    <script>
        let marks = prompt("Enter Your Grade : ");

        if(marks >= 90){
            alert("A Grade")
        }
        else if(marks >= 75){
            alert("B Grade")
        }
        else if(marks >=60){
            alert("C Grade")
        }
        else{
            alert(" Your are Fail")
        }
        location.reload()
    </script>
</body>
</html>

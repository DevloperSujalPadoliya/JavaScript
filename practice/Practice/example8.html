<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example8</title>
</head>
<body>
    <script>
        let a = new Date().getDay()
       
        switch(true){
            case (a == 0):
            alert("Weekend")
            break;

            case (a == 1):
            alert("Today is Monday")
            break;

            case (a == 2):
            alert("Today is tuesday")
            break;

            case (a == 3):
            alert("Today is Wenday")
            break;
            
            case (a == 4):
            alert("Today is Thuesday")
            break;

            case (a == 5):
            alert("Today is Friday")
            break;

            case (a == 6):
            alert("Weekend")
            break;

            default:
                alert("Enter the proper day number")
            

        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example14</title>
    <style>
        .color{
            width: 50px;
            height: 50px;
            background-color: white;
            border-radius: 100px;
        }
    </style>
</head>
<body>
    <div class="color" id="display"></div><br><br>
    <button onclick="redclick()">Red</button>
    <button onclick="greenclick()">Green</button>
    <button onclick="blueclick()">Blue</button>

    <script>
        function redclick(){
            document.getElementById("display").style.backgroundColor = "red"
        }

        
        function greenclick(){
            document.getElementById("display").style.backgroundColor = "green"
        }

        function blueclick(){
            document.getElementById("display").style.backgroundColor = "yellow"
        }
    </script>
</body>
</html>

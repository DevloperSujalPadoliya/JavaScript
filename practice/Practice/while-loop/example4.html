<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the prime number</title>
</head>
<body>
    <script>
        let i = 1;
        let n = 10;
        let a = prompt("Enter the number")

        while(i <= n){
            if(a % 2  == 0){
                console.log(a + " This is The prime number : ");
                
            }
            else{
                console.log(a  + " Not prime Number : ");
                
            }
            // break;
            i++
        }
    </script>
</body>
</html>

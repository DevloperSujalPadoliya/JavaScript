<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right side trangle</title>
</head>
<body>
    <script>
        let i = 1;
        let n = 5;

        while(i <= n){
            let row = ""
            let j = 1
            while(j <= i){
                row += "*";
                j++
            }
            console.log(row);
            
            i++;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prime number upto 1 to 100</title>
</head>
<body>
    <script>
        let i = 1;
        let n = 100;

        while(i <= n){
            if (i % 2 == 0) {
                console.log(i + "This is prime number ");
                
            }
            else{
                console.log(i);
                
            }
            i++
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>find the smallest number</title>
</head>

<body>
    <script>
        let a = 10;
        let b = 5;
        let c = 0;
        let n = 1;
        let i = 1

        while (i <= n) {
            if (a < b) {
                console.log(a + " first");

            }
            else if (b < c) {
                console.log(b + "second");

            }
            else {
                console.log(c + "third");

            }
            i++
        }
    </script>
</body>

</html>

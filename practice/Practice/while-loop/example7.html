<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sum of the two number</title>
</head>
<body>
    <script>
        let i = 1;
        let n = 1;
        let num1 = Number(prompt("Enter the number 1 :"))
        let num2 = Number(prompt("Enter the number 2 :"))

        while(i <= n){
            let sum = num1 + num2;
            console.log(  "This is sum of the number " + sum);
            
            i++
        }
    </script>
</body>
</html>

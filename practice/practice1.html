<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            padding: 0;
            margin: 0;
        }

        .main {
            width: 100vw;
            height: 100vh;
            background-color: lightgreen;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 40%;
            height: 50%;
            background-color: lightblue;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .number {
            width: 100%;
            height: 10%;
            background-color: aqua;
            text-align: center;
            align-content: center;
            font-size: 30px;
            letter-spacing: 20px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box">
            <div class="number" id="num"></div>
            <br>
            <input type="text" id="input1"><br>
            <button onclick="checktheaddar()">click</button>
        </div>
    </div>

    <script>


        function getsixnumber() {
            let x = 100000;
            let y = 999999;
            return Math.floor(Math.random() * (y - x)) + x;

        }

        result = getsixnumber()
        document.getElementById("num").innerHTML = result

        function checktheaddar() {
            let input1 = document.getElementById("input1").value;

            if (result == input1) {
                alert("You Addar is correct")
            }
            else{
                alert("Enter Your addhar")
            }

        }


    </script>
</body>

</html>

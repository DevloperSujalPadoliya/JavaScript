<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student marks</title>
    <style>
        .box-1{
            width: 300px;
            height: 300px;
            background-color: red;
            display: none;
        }
        .box-2{
            width: 300px;
            height: 300px;
            background-color: red;
            display: none;
        }
    </style>
</head>

<body>
    <input type="radio" name="class" value="class" id="10-class"><label>10 class</label>
    <input type="radio" name="class" value="class" id="12-class"><label>12 class</label>

    <div class="box-1" id="box-1"><h1>10</h1>
    <input type="text" id="input1">
    <!-- <input type="text" id="input2"> -->
<button onclick="grade1()">click</button></div>

    <div class="box-2" id="box-2"><h1>12</h1></div>
    <button onclick="getvalue()">click</button>
    <script>

        function getvalue() {

            grade = "";
            if (document.getElementById("10-class").checked) {
                grade = "10-class"
            }
            else if (document.getElementById("12-class").checked) {
                grade = "12-class"
            }
            else {
                grade = "no option selected"
            }
            
            if(grade == "10-class"){
                document.getElementById("box-1").style.display ="block";
            }
            else{
                document.getElementById("box-2").style.display ="block";
            }
        }

        function grade1() {
            let marks = document.getElementById("input1").value;
            let total = 500

            let s = marks/total * 100;
            alert(s + "%")

            if (marks >= 90) {
                alert("A Grade")
            }
            else if (marks >= 75) {
                alert("B Grade")
            }

            else if (marks >= 50) {
                alert("C Garde")
            }

            else if (marks >= 35) {
                alert("D Grade")
            }

            else {
                alert("fail")
            }

        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 100vw;
            height: 100vh;
            background-color: rgb(255, 255, 255);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box{
            width: 40%;
            height: 80%;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 1px 20px rgba(0, 0, 0, 0.295);
            border-radius: 10px;


        }

        .display{
            width: 90%;
            height: 40%;
            background-color: lightcoral;
            border-radius: 10px;
            text-align: center;
            align-content: center;
            font-size: 30px;
            color: white;
        }

        input{
            width: 80%;
            height: 30px;
              border-radius: 5px;
              border: solid 1px;
        }

        button{
            width: 90%;
            height: 30px;
            border: none;
            font-size: 20px;
            color: white;
             border-radius: 5px;
            background-color: rgb(41, 206, 41);
        }

        span{
            margin-right: 290px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">
          <div class="display" id="display"></div><br><br><br>
          <span>Enter Your Age :</span><br>
                <input id="input1" type="number" placeholder="Enter a number"><br>
                <!-- <span>Enter The exponent :</span> -->
                <!-- <input id="input2" type="number" placeholder="Enter a number"><br> -->
            
                <button onclick="modulesnum()">Check The Age</button>
        </div>
    </div>

    <script>

        function modulesnum(){
        
            let age = document.getElementById("input1").value;
            if(age >=18){
                document.getElementById("display").innerHTML = "Eligibale to vote : ";
            }

            else{
                document.getElementById("display").innerHTML = " Not Eligibale to vote : ";
            }
           
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            width: 100vw;
            height: 100vh;
            background-color: rgb(255, 255, 255);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box{
            width: 40%;
            height: 80%;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 1px 20px rgba(0, 0, 0, 0.295);
            border-radius: 10px;


        }

        .display{
            width: 90%;
            height: 20%;
            background-color: lightcoral;
            border-radius: 10px;
            text-align: center;
            align-content: center;
            font-size: 20px;
            color: white;
        }

        input{
            width: 80%;
            height: 30px;
              border-radius: 5px;
              border: solid 1px;
        }

        button{
            width: 90%;
            height: 30px;
            border: none;
            font-size: 20px;
            color: white;
             border-radius: 5px;
            background-color: rgb(41, 206, 41);
        }

        span{
            margin-right: 320px;
            font-size: 20px;
        }

        .requre{
            width: 90%;
            height: 20%;
            background-color: lightblue;
            text-align: center;
            align-content: center;
            border-radius: 10px;
        }
        b{
            color: red;
        }

        .label1{
            font-size: 180%;
            letter-spacing:  10px;
            font-weight: 600;
        }

       
    </style>
</head>
<body>
    <div class="main">
        <div class="box">
            <label class="label1">Even Number Checker</label><br>
            <label class="label2">(Using Bitwise AND Operator)</label><br>
          
          <span>Enter A Number : </span><br>
                <input id="input1" type="number" placeholder="Enter a number"><br><br>
                <!-- <span>Your Height (cm):</span>
                <input id="input2" type="number" placeholder="Enter a number"><br> -->
            
                <button onclick="modulesnum()">click</button><br><br>
                <div class="display" id="display"></div>
        </div>
    </div>

    <script>

        function modulesnum(){

          let even = document.getElementById("input1").value;

          
          if((even & 1)==0){
            document.getElementById("display").innerHTML = even + " <b>is Even</b> " + "(" + even +" & 1 != 0)" + ")";
          }
          else{
            document.getElementById("display").innerHTML = even + " <b>is Odd</b> " + "(" + even +" & 1 != 0)" + ")"
          }

        }
    </script>
</body>
</html>

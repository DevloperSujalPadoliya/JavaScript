<body>
    <script>
        let mark = prompt("Enter a marks : ")
        let result = (mark >= 90) ? "A Grade" : 
        (mark >= 75) ? "B Grade" : 
        (mark >= 50) ? "C Grade" : 
        (mark >= 35) ? "D Grade" : 
        "fail"
        alert(result)
    </script>

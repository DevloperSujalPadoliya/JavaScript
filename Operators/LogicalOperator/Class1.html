<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Student Marks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Tangerine:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        .main {
            width: 100vw;
            height: 100vh;
            background-color: rgb(255, 255, 255);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Roboto;
        }

        .box {
            width: 70%;
            height: 95%;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 1px 20px rgba(0, 0, 0, 0.295);
            border-radius: 10px;


        }

        .display {
            width: 80%;
            height: 20%;
            background-color: lightgreen;
            border-radius: 10px;
            text-align: center;
            align-content: center;
            font-size: 20px;
            color: black;
            display: none;
        }

        input {
            width: 65%;
            height: 30px;
            border-radius: 5px;
            border: solid 1px;
        }

        button {
            width: 30%;
            height: 15%;
            border: none;
            font-size: 20px;
            color: white;
            border-radius: 5px;
            margin-bottom: 30px;
            background-color: purple;
        }

        span {
            margin-right: 320px;
            font-size: 20px;
        }

        .span1 {

            margin-right: 0px;
            font-size: 40px;
            margin-bottom: 80px;
        }

        .box2 {
            width: 100%;
            height: 100%;
            background-color: rgba(255, 0, 0, 0);
            display: grid;
            flex-direction: column;
            justify-items: center;
            align-items: center;
            grid-template-columns: 1fr 1fr ;
            grid-template-rows: 1fr 1fr 1fr;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box">
            <span class="span1">Score Comparator</span>

            <div class="box2">
                
                <input type="text" placeholder="Enter Student Marks" id="input1"> 
                <input type="text" placeholder="Enter Student Marks" id="input2">
                <input type="text" placeholder="Enter Student Marks" id="input3">
                <input type="text" placeholder="Enter Student Marks" id="input4">
                <input type="text" placeholder="Enter Student Marks" id="input5">
            </div>

            <button onclick="StudentMarks()">Result</button>
            <div class="display" id="display">
                <p id="display1"></p>
                <p id="display2"></p>
                <p id="display3"></p>
            </div><br><br><br>
        </div>
    </div>

    <script>

        function StudentMarks() {
            let student1 = Number(document.getElementById("input1").value);

            let student2 = Number(document.getElementById("input2").value);

            let student3 = Number(document.getElementById("input3").value);

            let student4 = Number(document.getElementById("input4").value);

            let student5 = Number(document.getElementById("input5").value);

            TotalMark = student1 + student2 + student3 + student4 + student5;
            percent = TotalMark / 500 * 100;

            document.getElementById("display1").innerHTML = "Total Marks Obtained : " + TotalMark;
            document.getElementById("display").style.display = "block";

            document.getElementById("display2").innerHTML = "Total Percentage is : " + percent + "%";

            if (percent >= 35) {
                document.getElementById("display3").innerHTML = "Your Result is Pass";
            }

            else {
                document.getElementById("display3").innerHTML = "Your Result is Fail";
            }


        }
    </script>
</body>

</html>

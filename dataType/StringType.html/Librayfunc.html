<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String function </title>
</head>
<body>
    <script>
        let stri = prompt("Enter string :   ");

        // alert(stri)

        console.log("Original string : " + stri);

        // this is  uppercase string use character is small to big alphabate 

        let newstri = stri.toUpperCase(); // toUpperCase this is libray function 
        console.log(newstri);
        

            // this is  lowercase string use character is big to small alphabate 

        let old = stri.toLowerCase(); // toLowerCase this is libray function 
        console.log(old);
        

        let strilength = stri.length; //string length is use to measure the string length  
        console.log(strilength);
        

        let Newstri = "Good Morning";

        let a = Newstri + " " + stri;

        console.log(a);

         let big = "sujal";

         let lettet = big.charAt(5);
         console.log(lettet);
         
        
        
    </script>
</body>
</html>
